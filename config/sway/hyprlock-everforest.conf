## Everforest hyprlock (scripts/current_lock picks hyprlock-<theme>.conf, hyprlock.conf otherwise).
## Soft and quiet : the blurred forest wallpaper, a large thin clock, a translucent rounded
## card with the avatar and a pill password field. Positions are from the screen center, y goes up.

# Colors ($bg, $main, $fg… $<name>_hex for markup, $bg_glass / $surface_glass) : generated by theme/theme.sh
source = ~/.config/sway/hyprlock-colors.conf
# Background : the wallpaper cropped per output and blurred, by scripts/current_lock
source = ~/.cache/neobrutal-lock/hyprlock-bg.conf

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
    ignore_empty_input = true
}

# Fingerprint (fprintd) in parallel with the password
auth {
    fingerprint:enabled = true
}

#-- Clock + date ----------------------------------------------------
label {
    monitor =
    zindex = 4
    text = cmd[update:1000] echo "<span font_weight='200'>$(date +%H:%M)</span>"
    color = $fg
    font_size = 110
    font_family = $font
    shadow_passes = 2
    shadow_size = 6
    shadow_color = $bg_glass
    position = 0, 300
    halign = center
    valign = center
}
label {
    monitor =
    zindex = 4
    text = cmd[update:60000] echo "$(LC_ALL=C date '+%A, %B %-d')"
    color = $main
    font_size = 17
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $bg_glass
    position = 0, 205
    halign = center
    valign = center
}

#-- Card --------------------------------------------------------------
shape {
    monitor =
    zindex = 1
    size = 420, 330
    color = $bg_glass
    rounding = 24
    border_size = 1
    border_color = $border
    position = 0, -60
    halign = center
    valign = center
}

# avatar (~/.face, made square by scripts/current_lock) in a green ring
image {
    monitor =
    zindex = 3
    path = ~/.cache/neobrutal-lock/avatar.png
    size = 112
    rounding = -1
    border_size = 3
    border_color = $main
    position = 0, 25
    halign = center
    valign = center
}
label {
    monitor =
    zindex = 4
    text = <span foreground="$muted_hex">welcome back,</span> <b>$USER</b>
    color = $fg
    font_size = 13
    font_family = $font
    position = 0, -60
    halign = center
    valign = center
}

# password : pill field, the outline turns blue / red / orange on check / fail / caps lock
input-field {
    monitor =
    zindex = 4
    size = 320, 50
    rounding = -1
    outline_thickness = 2
    outer_color = $border
    inner_color = $surface_glass
    font_color = $fg
    font_family = $font
    check_color = $blue
    fail_color = $red
    capslock_color = $orange
    dots_size = 0.22
    dots_spacing = 0.35
    dots_rounding = -1
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="$muted_hex">󰌾  password or fingerprint</span>
    fail_text = <span foreground="$red_hex">wrong password ($ATTEMPTS)</span>
    position = 0, -135
    halign = center
    valign = center
}

# lock time (update:0 = evaluated once, at lock)
label {
    monitor =
    zindex = 4
    text = cmd[update:0] echo "<span foreground='$muted_hex'>󰥔  locked at $(date +%H:%M)</span>"
    color = $fg
    font_size = 11
    font_family = $font
    position = 0, -190
    halign = center
    valign = center
}

#-- Tech quote (random at each lock, list in quotes.txt) ----------
label {
    monitor =
    zindex = 4
    text = cmd[update:0] ~/.config/sway/scripts/quote "$main_hex"
    text_align = center
    color = $fg
    font_size = 12
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $bg_glass
    position = 0, 110
    halign = center
    valign = bottom
}

#-- Now playing (hidden when nothing plays) ----------------------
label {
    monitor =
    zindex = 4
    text = cmd[update:2000] p="playerctl --player=tidal-hifi,spotify,%any"; t="$($p metadata title 2>/dev/null)"; [ -n "$t" ] && echo "<span foreground='$main_hex'>󰝚</span>  $($p metadata artist 2>/dev/null) · $t"
    color = $fg
    font_size = 11
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $bg_glass
    position = 0, 50
    halign = center
    valign = bottom
}
