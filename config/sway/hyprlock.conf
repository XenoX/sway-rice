## Neo Brutalism / Everforest hyprlock — same look as the SDDM login screen.
## Thick black borders, hard offset shadows (a black shape under each block,
## offset down-right), flat colors. Positions are from the screen center, y goes up.
## zindex : backgrounds -2/-1, shadows 1, blocks 2, things on blocks 3, text and input 4, text on tags 5.

# Colors ($bg, $main, $ink… and $<name>_hex for markup) and shapes ($radius, $bw_*, $tilt,
# $shadow_shape = transparent when the theme has no hard shadow) : generated by theme/neobrutal.sh
source = ~/.config/sway/hyprlock-colors.conf
# Background : the dot grid, rendered per output by scripts/current_lock
source = ~/.cache/neobrutal-lock/hyprlock-bg.conf

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
    ignore_empty_input = true
}

# Fingerprint (fprintd) in parallel with the password
auth {
    fingerprint:enabled = true
}

#-- Clock : surface card (not the main color), so it stays quiet ---
shape {
    monitor =
    zindex = 1
    size = 340, 130
    color = $shadow_shape
    rounding = $radius
    position = 8, 322
    halign = center
    valign = center
}
shape {
    monitor =
    zindex = 2
    size = 340, 130
    color = $surface
    rounding = $radius
    border_size = $bw_card
    border_color = $border
    position = 0, 330
    halign = center
    valign = center
}
label {
    monitor =
    zindex = 4
    text = cmd[update:1000] echo "$(date +%H:%M)"
    color = $main
    font_size = 72
    font_family = $font
    position = 0, 330
    halign = center
    valign = center
}

#-- Date tag (tilted, on the clock card's corner) ------------------
shape {
    monitor =
    zindex = 3
    size = 230, 30
    color = $shadow_shape
    rounding = $radius
    rotate = $tilt
    position = 134, 391
    halign = center
    valign = center
}
shape {
    monitor =
    zindex = 4
    size = 230, 30
    color = $pink
    rounding = $radius
    border_size = $bw_tag
    border_color = $border
    rotate = $tilt
    position = 130, 395
    halign = center
    valign = center
}
label {
    monitor =
    zindex = 5
    text = cmd[update:60000] echo "<b>$(LC_ALL=C date '+%A, %B %-d' | tr '[:lower:]' '[:upper:]')</b>"
    color = $ink
    font_size = 11
    font_family = $font
    rotate = $tilt
    position = 130, 395
    halign = center
    valign = center
}

#-- Card -------------------------------------------------------
shape {
    monitor =
    zindex = 1
    size = 460, 404
    color = $shadow_shape
    rounding = $radius
    position = 10, -22
    halign = center
    valign = center
}
shape {
    monitor =
    zindex = 2
    size = 460, 404
    color = $surface
    rounding = $radius
    border_size = $bw_card
    border_color = $border
    position = 0, -12
    halign = center
    valign = center
}

# title bar : LOCKED + three squares, like the SDDM card
shape {
    monitor =
    zindex = 3
    size = 460, 56
    color = $main
    rounding = $radius
    border_size = $bw_card
    border_color = $border
    position = 0, 162
    halign = center
    valign = center
}
label {
    monitor =
    zindex = 4
    text = <b>󰌾  LOCKED</b>
    color = $ink
    font_size = 15
    font_family = $font
    position = -160, 162
    halign = center
    valign = center
}
shape {
    monitor =
    zindex = 4
    size = 16, 16
    color = $red
    rounding = $radius
    border_size = $bw_dot
    border_color = $border
    position = 158, 162
    halign = center
    valign = center
}
shape {
    monitor =
    zindex = 4
    size = 16, 16
    color = $yellow
    rounding = $radius
    border_size = $bw_dot
    border_color = $border
    position = 182, 162
    halign = center
    valign = center
}
shape {
    monitor =
    zindex = 4
    size = 16, 16
    color = $green
    rounding = $radius
    border_size = $bw_dot
    border_color = $border
    position = 206, 162
    halign = center
    valign = center
}

# avatar (~/.face) : thick black border + hard shadow
shape {
    monitor =
    zindex = 3
    size = 168, 168
    color = $shadow_shape
    rounding = -1
    position = 8, 27
    halign = center
    valign = center
}
image {
    monitor =
    zindex = 4
    path = ~/.cache/neobrutal-lock/avatar.png  # square ~/.face, made by scripts/current_lock
    size = 168
    rounding = -1
    border_size = $bw_card
    border_color = $border
    position = 0, 35
    halign = center
    valign = center
}

# password : black shadow + field (outline turns blue / red / orange on check / fail / caps lock)
shape {
    monitor =
    zindex = 3
    size = 400, 56
    color = $shadow_shape
    rounding = $radius
    position = 5, -100
    halign = center
    valign = center
}
input-field {
    monitor =
    zindex = 4
    size = 400, 56
    rounding = $radius
    outline_thickness = $bw_tag
    outer_color = $border
    inner_color = $bg
    font_color = $fg
    font_family = $font
    check_color = $blue
    fail_color = $red
    capslock_color = $orange
    dots_size = 0.25
    dots_spacing = 0.3
    dots_rounding = 0
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="$muted_hex">password or fingerprint</span>
    fail_text = <b>WRONG PASSWORD ($ATTEMPTS)</b>
    position = 0, -95
    halign = center
    valign = center
}

# tags : lock time (update:0 = evaluated once, at lock) + unlock hint
# icons from the Nerd Font only : a fallback glyph (↵) makes the line taller and the text sits off center
shape {
    monitor =
    zindex = 3
    size = 130, 36
    color = $shadow_shape
    rounding = $radius
    position = -78, -176
    halign = center
    valign = center
}
shape {
    monitor =
    zindex = 4
    size = 130, 36
    color = $cyan
    rounding = $radius
    border_size = $bw_tag
    border_color = $border
    position = -82, -172
    halign = center
    valign = center
}
label {
    monitor =
    zindex = 5
    text = cmd[update:0] echo "<b>󰥔  $(date +%H:%M)</b>"
    color = $ink
    font_size = 13
    font_family = $font
    position = -82, -172
    halign = center
    valign = center
}
shape {
    monitor =
    zindex = 3
    size = 150, 36
    color = $shadow_shape
    rounding = $radius
    position = 76, -176
    halign = center
    valign = center
}
shape {
    monitor =
    zindex = 4
    size = 150, 36
    color = $purple
    rounding = $radius
    border_size = $bw_tag
    border_color = $border
    position = 72, -172
    halign = center
    valign = center
}
label {
    monitor =
    zindex = 5
    text = <b>󰌑  UNLOCK</b>
    color = $ink
    font_size = 13
    font_family = $font
    position = 72, -172
    halign = center
    valign = center
}

#-- Tech quote (random at each lock, list in quotes.txt) ----------
label {
    monitor =
    zindex = 4
    text = cmd[update:0] ~/.config/sway/scripts/quote "$main_hex"
    text_align = center
    color = $fg
    font_size = 13
    font_family = $font
    position = 0, -300
    halign = center
    valign = center
}

#-- Now playing (hidden when nothing plays) ----------------------
label {
    monitor =
    zindex = 4
    text = cmd[update:2000] p="playerctl --player=tidal-hifi,spotify,%any"; t="$($p metadata title 2>/dev/null)"; [ -n "$t" ] && echo "󰝚  $($p metadata artist 2>/dev/null) · $t"
    color = $fg
    font_size = 12
    font_family = $font
    position = 0, 60
    halign = center
    valign = bottom
}
